name: Gloven Application Scoring

on:
  pull_request:
    paths:
      - 'gloven_starter_kit/data/apps/*.json'

jobs:
  score-application:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: gloven_starter_kit/tools/gloven-cli
        run: npm ci

      - name: Build CLI
        working-directory: gloven_starter_kit/tools/gloven-cli
        run: npm run build

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: 'gloven_starter_kit/data/apps/*.json'

      - name: Score applications
        working-directory: gloven_starter_kit/tools/gloven-cli
        env:
          DRY_RUN: 'true'
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Scoring: $file"
            filename=$(basename "$file" .json)
            node dist/index.js score \
              --input "../../$file" \
              --out "../../out/${filename}_score.json"
          done

      - name: Upload score artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-scores
          path: gloven_starter_kit/out/*_score.json
          retention-days: 30

      - name: Comment PR with summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find all score files
            const outDir = 'gloven_starter_kit/out';
            const scoreFiles = fs.readdirSync(outDir)
              .filter(f => f.endsWith('_score.json'));
            
            let comment = '## 📊 Application Scoring Results\n\n';
            
            for (const scoreFile of scoreFiles) {
              const scorePath = path.join(outDir, scoreFile);
              const scoreData = JSON.parse(fs.readFileSync(scorePath, 'utf-8'));
              
              const decisionEmoji = {
                'GO': '✅',
                'NO_GO': '❌',
                'WAITLIST': '⏸️'
              };
              
              comment += `### ${decisionEmoji[scoreData.decision] || '📋'} ${scoreData.startup_name}\n\n`;
              comment += `**Decision:** ${scoreData.decision}\n`;
              comment += `**Score:** ${scoreData.weighted_total_0to100}/100\n\n`;
              comment += `**Summary:** ${scoreData.summary}\n\n`;
              
              if (scoreData.red_flags && scoreData.red_flags.length > 0) {
                comment += `**🚩 Red Flags:**\n`;
                scoreData.red_flags.forEach(flag => {
                  comment += `- ${flag}\n`;
                });
                comment += '\n';
              }
              
              comment += `**📎 Full Report:** Check artifacts for complete score details\n\n`;
              comment += '---\n\n';
            }
            
            comment += '*Generated by Gloven CLI in DRY-RUN mode*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });