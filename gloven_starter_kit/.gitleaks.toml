# Gitleaks Configuration
# Enterprise Maturity Pack v1 - Slice 1
#
# GitLeaks configuration for detecting secrets and sensitive information
# in the Gloven portal codebase.

title = "Gloven Portal Secrets Detection"

# Global configuration
[extend]
useDefault = true

# Custom rules for Gloven-specific patterns
[[rules]]
id = "gloven-api-key"
description = "Gloven API Key"
regex = '''gloven[_-]?api[_-]?key["']?\s*[:=]\s*["']?[a-zA-Z0-9]{32,}["']?'''
tags = ["key", "gloven"]

[[rules]]
id = "gloven-secret-key"
description = "Gloven Secret Key"
regex = '''gloven[_-]?secret[_-]?key["']?\s*[:=]\s*["']?[a-zA-Z0-9]{32,}["']?'''
tags = ["key", "gloven", "secret"]

[[rules]]
id = "gloven-database-url"
description = "Gloven Database URL with credentials"
regex = '''DATABASE_URL=["'].*://[^@]+@[^"']+["']'''
tags = ["database", "credentials"]

# NextAuth specific rules
[[rules]]
id = "nextauth-secret"
description = "NextAuth Secret"
regex = '''NEXTAUTH_SECRET=["']?[a-zA-Z0-9]{32,}["']?'''
tags = ["auth", "nextauth", "secret"]

[[rules]]
id = "nextauth-url"
description = "NextAuth URL with sensitive path"
regex = '''NEXTAUTH_URL=["']https?://[^"']+["']'''
tags = ["auth", "nextauth"]

# Email configuration
[[rules]]
id = "email-server-password"
description = "Email Server Password"
regex = '''EMAIL_SERVER_PASSWORD=["']?[^"'\s]{4,}["']?'''
tags = ["email", "password"]

[[rules]]
id = "email-server-user"
description = "Email Server Username"
regex = '''EMAIL_SERVER_USER=["']?[^"'\s]{4,}["']?'''
tags = ["email", "username"]

# Database credentials
[[rules]]
id = "database-password"
description = "Database Password"
regex = '''(?:password|pwd)=["']?[^"'\s]{4,}["']?'''
tags = ["database", "password"]

# API keys for common services
[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[abpr]-[0-9a-zA-Z-]+'''
tags = ["slack", "token"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks.slack.com/services/[A-Za-z0-9+/]{43,48}'''
tags = ["slack", "webhook"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws(.{0,20})?['\"][0-9a-zA-Z/+]{40}['\"]'''
tags = ["aws", "secret"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\\-_]{35}'''
tags = ["google", "api", "key"]

[[rules]]
id = "google-oauth"
description = "Google OAuth Token"
regex = '''ya29\\.[0-9A-Za-z\\-_]+'''
tags = ["google", "oauth", "token"]

[[rules]]
id = "stripe-api-key"
description = "Stripe API Key"
regex = '''(sk|pk)_(test|live)_[0-9a-zA-Z]{24,}'''
tags = ["stripe", "api", "key"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''ghp_[a-zA-Z0-9]{36}'''
tags = ["github", "token"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth Token"
regex = '''github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}'''
tags = ["github", "oauth", "token"]

# JWT tokens
[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_-]{10,}'''
tags = ["jwt", "token"]

# Private keys
[[rules]]
id = "rsa-private-key"
description = "RSA Private Key"
regex = '''-----BEGIN RSA PRIVATE KEY-----'''
tags = ["rsa", "private-key"]

[[rules]]
id = "ssh-private-key"
description = "SSH Private Key"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
tags = ["ssh", "private-key"]

[[rules]]
id = "pgp-private-key"
description = "PGP Private Key"
regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
tags = ["pgp", "private-key"]

# Generic secrets
[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''[aA][pP][iI]_?[kK]ey["']?\s*[:=]\s*["']?[a-zA-Z0-9]{32,45}["']?'''
tags = ["api", "key"]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''[sS]ecret["']?\s*[:=]\s*["']?[a-zA-Z0-9]{32,}["']?'''
tags = ["secret"]

[[rules]]
id = "generic-password"
description = "Generic Password"
regex = '''[pP]assword["']?\s*[:=]\s*["']?[^"'\s]{4,}["']?'''
tags = ["password"]

# Allowlist - Files and paths to ignore
[allowlist]
description = "Allowlist for common non-sensitive files"
files = [
  # Documentation
  "**/*.md",
  "**/*.txt",
  
  # Configuration examples
  "**/.env.example",
  
  # Test files
  "**/test/**",
  "**/tests/**",
  
  # Public assets
  "**/public/**",
  
  # Build outputs
  "**/dist/**",
  "**/build/**",
  "**/.next/**",
  
  # Dependencies
  "**/node_modules/**",
  "**/package-lock.json",
  
  # Database files (SQLite)
  "**/*.db",
  
  # Log files
  "**/*.log",
]

# Allowlist - Patterns to ignore
regexes = [
  # Example patterns in documentation
  '''example["']?\s*[:=]\s*["']?[a-zA-Z0-9]{10,}["']?''',
  
  # Test data
  '''test["']?\s*[:=]\s*["']?[a-zA-Z0-9]{10,}["']?''',
  
  # Placeholder values
  '''change-this-in-production''',
  '''your-[a-z-]+-here''',
  
  # Common false positives
  '''BEGIN CERTIFICATE''',
  '''localhost''',
  '''127\.0\.0\.1''',
  
  # Hex colors
  '''#[0-9a-fA-F]{6}''',
  
  # Version numbers
  '''version["']?\s*[:=]\s*["']?[0-9]+\.[0-9]+\.[0-9]+["']?''',
]

# Allowlist - Commit hashes to ignore
commits = [
  # Add specific commit hashes to ignore here if needed
]

# Allowlist - Specific secrets to ignore (use with caution)
secrets = [
  # Add specific secret values to ignore here if absolutely necessary
]

# Global settings
[general]
regexTimeout = 10000
maxTargetSize = 52428800
logLevel = "info"

# Output configuration
[output]
format = "json"
report = "gitleaks-report.json"
redact = true
verbose = false