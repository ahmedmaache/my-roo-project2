name: Weekly Health Report
on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  health-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gloven_starter_kit/tools/gloven-cli/package-lock.json
      
      - name: Install dependencies
        working-directory: gloven_starter_kit/tools/gloven-cli
        run: npm ci
      
      - name: Build CLI
        working-directory: gloven_starter_kit/tools/gloven-cli
        run: npm run build
      
      - name: Run health check
        working-directory: gloven_starter_kit/tools/gloven-cli
        env:
          DRY_RUN: true
        run: node dist/index.js health --json
        continue-on-error: true
      
      - name: Batch score applications
        working-directory: gloven_starter_kit/tools/gloven-cli
        env:
          DRY_RUN: true
        run: |
          node dist/index.js batch-score \
            --input ../../data/apps/applications.csv \
            --concurrency 1 \
            --out ../../out
      
      - name: Generate health report
        working-directory: gloven_starter_kit/tools/gloven-cli
        env:
          DRY_RUN: true
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node dist/index.js report --notify
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report-${{ github.run_number }}
          path: |
            gloven_starter_kit/out/reports/
            gloven_starter_kit/out/leaderboard.md
            gloven_starter_kit/out/shortlist.csv
            gloven_starter_kit/out/triage.md
            gloven_starter_kit/out/flags.md
          retention-days: 30
      
      - name: Comment on latest issue (if exists)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Try to read the health report
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'gloven_starter_kit/out/reports/gloven_health_report.md');
            
            if (!fs.existsSync(reportPath)) {
              console.log('No report found, skipping comment');
              return;
            }
            
            const report = fs.readFileSync(reportPath, 'utf8');
            
            // Find open issues with 'health-report' label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-report',
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (issues.data.length === 0) {
              console.log('No open health-report issues found');
              return;
            }
            
            // Post comment on latest issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body: `## 📊 Weekly Health Report\n\n${report}\n\n---\n*Generated by [Weekly Health Report workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`
            });